<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grok Office</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%230b0b0e'/%3E%3Crect x='4' y='3' width='8' height='1' fill='%23fff'/%3E%3Crect x='4' y='12' width='8' height='1' fill='%23fff'/%3E%3Crect x='3' y='4' width='1' height='8' fill='%23fff'/%3E%3Crect x='12' y='4' width='1' height='8' fill='%23fff'/%3E%3Cpath d='M12 3h1v1h-1zM11 4h1v1h-1zM10 5h1v1h-1zM9 6h1v1H9zM8 7h1v1H8zM7 8h1v1H7zM6 9h1v1H6zM5 10h1v1H5zM4 11h1v1H4zM3 12h1v1H3z' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <strong id="office-name">Grok HQ</strong>
      <span class="sub">virtual office</span>
    </div>
    <nav id="roster" aria-label="Employees"></nav>
    <div class="tools">
      <span id="clock" class="clock"></span>
      <span id="conn" class="conn" title="Connecting…"></span>
      <div class="zoom">
        <button id="zoom-out" title="Zoom out (-)">−</button>
        <button id="zoom-fit" title="Fit to window (0)"><span id="zoom-level">2x</span></button>
        <button id="zoom-in" title="Zoom in (+)">+</button>
      </div>
    </div>
  </header>
  <main id="stage">
    <canvas id="office" aria-label="Pixel art office"></canvas>
    <aside id="panel" hidden>
      <button id="p-close" class="close" title="Close (Esc)">×</button>
      <div class="p-head">
        <canvas id="portrait" width="80" height="104"></canvas>
        <div>
          <h2 id="p-name"></h2>
          <div id="p-role" class="role"></div>
          <div id="p-status" class="status-pill"></div>
        </div>
      </div>
      <dl>
        <dt>Current message</dt>
        <dd id="p-message" class="message"></dd>
        <dt>Last updated</dt>
        <dd id="p-updated"></dd>
        <dt>Seat</dt>
        <dd><span id="p-desk"></span> · <code id="p-id"></code></dd>
      </dl>
    </aside>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
